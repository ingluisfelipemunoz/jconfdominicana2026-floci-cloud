# Point all three AWS SDK v2 clients at Floci.
# When you run `eval "$(floci env)"`, AWS_ENDPOINT_URL and the dummy creds are
# already exported, so these fall through to the right values automatically.

quarkus.banner.enabled=false
quarkus.log.level=WARN

# --- S3 ---
quarkus.s3.endpoint-override=${AWS_ENDPOINT_URL:http://localhost:4566}
quarkus.s3.aws.region=${AWS_DEFAULT_REGION:us-east-1}
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${AWS_ACCESS_KEY_ID:test}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${AWS_SECRET_ACCESS_KEY:test}
quarkus.s3.path-style-access=true
quarkus.s3.sync-client.type=url

# --- SQS ---
quarkus.sqs.endpoint-override=${AWS_ENDPOINT_URL:http://localhost:4566}
quarkus.sqs.aws.region=${AWS_DEFAULT_REGION:us-east-1}
quarkus.sqs.aws.credentials.type=static
quarkus.sqs.aws.credentials.static-provider.access-key-id=${AWS_ACCESS_KEY_ID:test}
quarkus.sqs.aws.credentials.static-provider.secret-access-key=${AWS_SECRET_ACCESS_KEY:test}
quarkus.sqs.sync-client.type=url

# --- DynamoDB ---
quarkus.dynamodb.endpoint-override=${AWS_ENDPOINT_URL:http://localhost:4566}
quarkus.dynamodb.aws.region=${AWS_DEFAULT_REGION:us-east-1}
quarkus.dynamodb.aws.credentials.type=static
quarkus.dynamodb.aws.credentials.static-provider.access-key-id=${AWS_ACCESS_KEY_ID:test}
quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=${AWS_SECRET_ACCESS_KEY:test}
quarkus.dynamodb.sync-client.type=url
