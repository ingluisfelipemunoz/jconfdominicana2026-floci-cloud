# Point the DynamoDB client at Floci. Note there is nothing Floci-specific here:
# it's a stock AWS SDK v2 client reading stock AWS environment variables.
#
# The one subtlety is the "endpoint duality". On the host, `eval "$(floci env)"`
# exports AWS_ENDPOINT_URL for you (and without it we fall through to
# localhost:4566). But from INSIDE a container Floci spawned, the Floci edge is
# not on localhost — it's back on the host. So the ECS task definition in
# setup.sh passes AWS_ENDPOINT_URL=http://host.docker.internal:4566 explicitly.
#
# Floci does this injection automatically for Lambda containers; as of server
# 1.5.31 it does NOT for ECS tasks, which is why setup.sh sets it by hand. If you
# drop that env var, /q/health still passes and /orders hangs — the SDK sits there
# trying to reach the container's own localhost.

quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

quarkus.dynamodb.endpoint-override=${AWS_ENDPOINT_URL:http://localhost:4566}
quarkus.dynamodb.aws.region=${AWS_REGION:us-east-1}
quarkus.dynamodb.aws.credentials.type=static
quarkus.dynamodb.aws.credentials.static-provider.access-key-id=${AWS_ACCESS_KEY_ID:test}
quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=${AWS_SECRET_ACCESS_KEY:test}
quarkus.dynamodb.sync-client.type=url

app.table=${ORDERS_TABLE:orders}
